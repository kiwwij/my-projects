<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwwij | Projects Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📂</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <meta name="description" content="Personal Website & Project Archive by kiwwij">
    <meta property="og:title" content="Kiwwij | Projects Hub">
    <meta property="og:description" content="kiwwij's personal archive of web projects, games, and tools.">
    <meta property="og:image" content="https://kiwwij.github.io/my-projects/css/index/screenshot_of_kiwwij's_website.png">

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/index/achievements.css">
</head>
<body>
    <div class="main-wrapper">
        <header>
            <div class="profile">
                <img src="https://avatars.akamai.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg" alt="K" class="avatar" title="Avatar from Steam">
                <h1>kiwwij</h1>
                <p class="bio">Personal Website & Project Archive</p>
            </div>
            <div class="btn-container">
                <svg viewBox="0 0 16 16" class="bi bi-sun-fill" fill="currentColor" width="23" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z" color="#f39c12"></path>
                </svg>
                <label class="switch btn-color-mode-switch">
                    <input value="1" id="color_mode" name="color_mode" type="checkbox">
                    <label class="btn-color-mode-switch-inner" data-off="Light" data-on="Dark" for="color_mode"></label>
                </label>
                <svg viewBox="0 0 16 16" class="bi bi-moon-stars-fill" fill="currentColor" width="23" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z" color="#f1c40f"></path>
                    <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732L13.863.1z" color="#ffffff"></path>
                </svg>
            </div>
        </header>
        <main>
            <div class="controls">
                <h2>
                    <i class='bx bx-folder-open'></i> 
                    My projects
                    <span id="project-count" class="count-badge">0</span>
                </h2>
                
                <div class="actions-wrapper">
                    <button id="filter-new-btn" class="icon-btn" title="Show only new projects">
                        <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                        fill="currentColor" viewBox="0 0 24 24" >
                        <path d="M20 4h-8.59L10 2.59C9.62 2.21 9.12 2 8.59 2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 14H4V6h16z"></path><path d="M11 8v3H8v2h3v3h2v-3h3v-2h-3V8z"></path>
                        </svg>
                    </button>

                    <button id="random-btn" class="icon-btn" title="Open random project (R)">
                        <i class='bx bx-dice-5'></i>
                </button>

                    <div class="search-wrapper">
                        <i class='bx bx-search search-icon'></i>
                        <input type="text" id="search-input" placeholder="Find a project...">
                        <i class='bx bx-x clear-search' id="clear-search"></i>
                    </div>
                </div>

                <div id="tech-stats" class="tech-stats"></div>
            </div>
            <div id="projects-grid" class="grid">
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-line title"></div>
                        <div class="skeleton-line description"></div>
                        <div class="skeleton-line footer"></div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <a href="https://github.com/kiwwij" target="_blank">
                <i class='bx bxl-github'></i> GitHub
            </a>
            <span>•</span>
            <a href="https://kiwwij.github.io/kiwwij-social-links/" target="_blank">
                <i class='bx bx-link-alt'></i> Socials
            </a>
            <span>•</span>
            <span id="current-year"></span>
            <span>•</span>
            <span id="achievement-progress" class="ach-progress" title="Achievements">🏆 0/7</span>
        </footer>
    </div>
    
    <button onclick="topFunction()" id="scrollTopBtn" title="Go to top">
        <i class='bx bx-up-arrow-alt'></i>
    </button>
    <button onclick="bottomFunction()" id="scrollBottomBtn" title="Go to bottom">
        <i class='bx bx-down-arrow-alt'></i>
    </button>

    <div id="toast-container"></div>
    <script src="js/index.js"></script>
    <script src="js/index/achievements.js"></script>
</body>
</html>
