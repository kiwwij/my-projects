<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результати сесій | 5ПІ-24б</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/10691/10691802.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../../css/timetable.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="controls" style="justify-content: flex-start; gap: 15px; margin-bottom: 25px;">
        <a href="../timetable.html" class="nav-btn" style="text-decoration: none; width: 40px; height: 40px;">
            <i class='bx bx-arrow-back' style="font-size: 1.5rem;"></i>
        </a>
        <div class="date-display" style="font-size: 1.3rem;">Результати сесій</div>
    </div>

    <div style="background: var(--card-bg); padding: 15px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); position: relative;">
        <canvas id="resultsChart" height="220"></canvas>
    </div>

    <div class="stat-section-title" style="margin-top: 0; justify-content: center; font-size: 0.95rem; color: var(--text-muted);">
        <i class='bx bxs-graduation' style="display: flex; align-items: center;"></i> Бакалаврат
    </div>
    <div class="days-nav-wrapper">
        <div class="days-nav" id="bachelor-nav"></div>
    </div>

    <div class="stat-section-title" style="margin-top: 0; justify-content: center; font-size: 0.95rem; color: var(--text-muted);">
        <i class='bx bxs-book-reader' style="display: flex; align-items: center;"></i> Магістратура
    </div>
    <div class="days-nav-wrapper" style="margin-bottom: 20px;">
        <div class="days-nav" id="master-nav"></div>
    </div>

    <div class="sort-controls" id="sort-controls">
        <button class="sort-btn active" id="sort-name" onclick="setSortMode('name')">
            <i class='bx bx-sort-a-z'></i> Назва
        </button>
        <button class="sort-btn" id="sort-score" onclick="setSortMode('score')">
            <i class='bx bx-sort-down'></i> Бали
        </button>
    </div>

    <div id="results-content" style="display: flex; flex-direction: column; gap: 12px;"></div>
</div>

<script src="../../js/timetable/resultsData.js"></script>
<script src="../../js/timetable/results.js"></script>

<div style="text-align: center; opacity: 0.5; font-size: 12px; margin-top: 25px; padding-bottom: 10px;">
    &copy; <span id="current-year"></span> kiwwij
</div>

<script>document.getElementById('current-year').innerText = new Date().getFullYear();</script>

</body>
</html>
