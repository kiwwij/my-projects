    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        
        .tier-zone { 
            min-height: 140px; 
            transition: background-color 0.2s, border-color 0.2s;
        }
        
        .game-card { 
            cursor: grab; 
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            background-color: #2d3748;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .game-card:hover { transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .game-card:active { cursor: grabbing; transform: scale(0.95); }
        .game-card.dragging { opacity: 0.3; border: 2px dashed #cbd5e0; transform: scale(0.9); }
        
        .card-title-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            padding: 12px 4px 6px;
            font-size: 0.75rem;
            text-align: center;
            line-height: 1.1;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        .loading-spinner {
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 5px; right: 5px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        let currentData = {};

        function init() {
            const saved = localStorage.getItem('tierListGamesPro_v3');
            if (saved) {
                currentData = JSON.parse(saved);
            } else {
                currentData = JSON.parse(JSON.stringify(originalData));
            }
            renderTiers();
        }

        async function processQueue() {
            if (requestQueue.length === 0 || activeRequests >= MAX_CONCURRENT_REQUESTS) {
                return;
            }
            
            activeRequests++;
            const { title, cardElement } = requestQueue.shift();
            
            processQueue();
            
            try {
                const url = `https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(title)}&page_size=1`;
                const res = await fetch(url);
                const json = await res.json();
                
                if (json.results && json.results[0] && json.results[0].background_image) {
                    const imgUrl = json.results[0].background_image;
                    posterCache[title] = imgUrl;
                    localStorage.setItem('posterCache', JSON.stringify(posterCache));
                    applyPoster(cardElement, imgUrl);
                } else {
                    posterCache[title] = 'NOT_FOUND';
                    localStorage.setItem('posterCache', JSON.stringify(posterCache));
                    removeLoader(cardElement);
                }
            } catch (e) {
                console.error('API Error:', e);
                removeLoader(cardElement);
            } finally {
                activeRequests--;
                setTimeout(processQueue, 300);
            }
        }

        function loadCardPoster(cardElement, game) {
            if (game.img) {
                applyPoster(cardElement, game.img);
                return;
            }

            if (posterCache[game.title]) {
                if (posterCache[game.title] !== 'NOT_FOUND') {
                    applyPoster(cardElement, posterCache[game.title]);
                } else {
                    removeLoader(cardElement);
                }
                return;
            }

            const spinner = document.createElement('div');
            spinner.className = 'loading-spinner';
            cardElement.appendChild(spinner);

            requestQueue.push({ title: game.title, cardElement: cardElement });
            processQueue();
        }

        function applyPoster(card, url) {
            const finalUrl = (url.startsWith('games/') || url.startsWith('img/')) ? `img/${url.replace('img/', '')}` : url;
            card.style.backgroundImage = `url('${finalUrl}')`;
            removeLoader(card);
        }

        function removeLoader(card) {
            const spinner = card.querySelector('.loading-spinner');
            if (spinner) spinner.remove();
        }

        function renderTiers() {
            const container = document.getElementById('tier-container');
            container.innerHTML = '';

            for (const tier in tierColors) {
                const games = currentData[tier] || [];
                
                const row = document.createElement('div');
                row.className = 'flex flex-col md:flex-row bg-gray-900 rounded overflow-hidden shadow-lg border border-transparent transition-colors duration-200';
                
                const label = document.createElement('div');
                label.className = `w-full md:w-28 flex-shrink-0 flex items-center justify-center text-4xl font-bold py-6 ${tierColors[tier]}`;
                label.textContent = tier;
                
                const dropZone = document.createElement('div');
                dropZone.className = 'tier-zone flex-1 flex flex-wrap gap-2 p-3 relative rounded-r transition-colors duration-200';
                dropZone.dataset.tier = tier;
                
                dropZone.addEventListener('dragover', handleDragOverZone);
                dropZone.addEventListener('drop', handleDrop);

                games.forEach((game) => {
                    const card = document.createElement('div');
                    card.className = 'game-card w-24 h-32 md:w-28 md:h-40 rounded border border-gray-600 shadow-md';
                    card.draggable = true;
                    card.title = game.title;
                    card.gameData = game;

                    const titleOverlay = document.createElement('div');
                    titleOverlay.className = 'card-title-overlay';
                    titleOverlay.textContent = game.title;
                    card.appendChild(titleOverlay);

                    loadCardPoster(card, game);

                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragend', handleDragEnd);
                    
                    card.addEventListener('click', () => {
                        if (card.classList.contains('dragging')) return;
                        openDrawer(card);
                    });

                    dropZone.appendChild(card);
                });

                row.appendChild(label);
                row.appendChild(dropZone);
                container.appendChild(row);
            }
        }

        let draggedElement = null;

        function handleDragStart(e) {
            draggedElement = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedElement = null;
            document.querySelectorAll('.tier-zone').forEach(z => z.classList.remove('bg-gray-800/60'));
        }

        function handleDragOverZone(e) {
            e.preventDefault();
            const dropZone = e.currentTarget;
            
            document.querySelectorAll('.tier-zone').forEach(z => z.classList.remove('bg-gray-800/60'));
            dropZone.classList.add('bg-gray-800/60');
            
            const cards = [...dropZone.querySelectorAll('.game-card:not(.dragging)')];
            
            const hoverCard = cards.find(card => {
                const rect = card.getBoundingClientRect();
                return e.clientX >= rect.left && e.clientX <= rect.right &&
                       e.clientY >= rect.top && e.clientY <= rect.bottom;
            });

            if (hoverCard) {
                const rect = hoverCard.getBoundingClientRect();
                if (e.clientX < rect.left + rect.width / 2) {
                    dropZone.insertBefore(draggedElement, hoverCard);
                } else {
                    dropZone.insertBefore(draggedElement, hoverCard.nextSibling);
                }
            } else if (e.target === dropZone) {
                dropZone.appendChild(draggedElement);
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            document.querySelectorAll('.tier-zone').forEach(z => z.classList.remove('bg-gray-800/60'));
            syncDataFromDOM();
        }

        function syncDataFromDOM() {
            const newData = {};
            document.querySelectorAll('.tier-zone').forEach(zone => {
                const tier = zone.dataset.tier;
                newData[tier] = [];
                zone.querySelectorAll('.game-card').forEach(card => {
                    newData[tier].push(card.gameData);
                });
            });
            currentData = newData;
            localStorage.setItem('tierListGamesPro_v3', JSON.stringify(currentData));
        }

        function openDrawer(card) {
            currentEditingCard = card;
            document.getElementById('drawer-game-title').value = card.gameData.title;
            document.getElementById('drawer-game-review').value = card.gameData.review || "";
            
            const drawer = document.getElementById('edit-drawer');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.remove('translate-x-full');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-50', 'pointer-events-auto');
        }

        function closeDrawer() {
            currentEditingCard = null;
            const drawer = document.getElementById('edit-drawer');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.add('translate-x-full');
            overlay.classList.remove('opacity-50', 'pointer-events-auto');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function saveDrawerChanges() {
            if (!currentEditingCard) return;
            
            const newReview = document.getElementById('drawer-game-review').value;
            currentEditingCard.gameData.review = newReview;
            
            syncDataFromDOM();
            closeDrawer();
            
            currentEditingCard.classList.add('border-green-400');
            setTimeout(() => currentEditingCard.classList.remove('border-green-400'), 500);
        }

        function resetData() {
            if (confirm("Сбросить до оригинального состояния? Все изменения будут потеряны.")) {
                localStorage.removeItem('tierListGamesPro_v3');
                init();
            }
        }

    ]
};

if (typeof tierListData !== 'undefined') {
    
    tierListData['Игры'] = {
        type: 'game',
        data: {\n`;

            for (const tier in currentData) {
                jsContent += `            '${tier}': [\n`;
                currentData[tier].forEach(game => {
                    jsContent += `                {\n`;
                    jsContent += `                    title: "${game.title.replace(/"/g, '\\"')}",\n`;
                    if (game.ruTitle) jsContent += `                    ruTitle: "${game.ruTitle.replace(/"/g, '\\"')}",\n`;
                    if (game.review !== undefined) jsContent += `                    review: "${game.review.replace(/"/g, '\\"')}",\n`;
                    if (game.img) jsContent += `                    img: "${game.img}",\n`;
                    jsContent += `                },\n`;
                });
                jsContent += `            ],\n`;
            }

            jsContent += `        }
    };
}`;

            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'games-data.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                let tierListData = {};
                
                try {
                    eval(content);
                    if (tierListData['Игры'] && tierListData['Игры'].data) {
                        currentData = tierListData['Игры'].data;
                        localStorage.setItem('tierListGamesPro_v3', JSON.stringify(currentData));
                        renderTiers();
                    } else {
                        alert('Файл не содержит надёжных данных для тир-листа.');
                    }
                } catch (err) {
                    alert('Ошибка при чтении файла. Убедитесь, что загружён корректный games-data.js.');
                }
                
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        init();
    </script>
