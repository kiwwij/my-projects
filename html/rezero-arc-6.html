<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="kiwwij">
    <meta name="description" content="Полный пересказ 6-ой арки Re:Zero. История Башни Плеяд, испытаний и потерянных воспоминаний.">
    <title>Re:Zero - Пересказ 6-ой арки</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <link rel="stylesheet" href="../css/rezero-arc-6.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-content">
            <div class="logo">
                <i class='bx bx-book-reader'></i>
                <span>Пересказ 6-ой арки Re:Zero</span>
            </div>
            <div class="controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Переключить тему">
                    <i class='bx bx-moon'></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="hero">
            <img src="rezero-arc-6/rezero-arc-6.jpg" alt="Обложка 6-ой арки" loading="lazy" class="hero-image">
            
            <h1 id="main-title">Пересказ 6-ой арки Re:Zero</h1>
            <p class="short-desc">6-я арка охватывает события Башни Плеяд, потерю памяти Субару и масштабные битвы с Архиепископами Греха.</p>
        </div>

        <div class="volumes-section">
            <div class="volumes-badge">
                <i class='bx bx-book-bookmark'></i>
                <span>Тома ранобэ:</span>
            </div>
            
            <div class="posters-grid">
                <img src="rezero-arc-6/21.webp" alt="Том 21" loading="lazy">
                <img src="rezero-arc-6/22.webp" alt="Том 22" loading="lazy">
                <img src="rezero-arc-6/23.webp" alt="Том 23" loading="lazy">
                <img src="rezero-arc-6/24.webp" alt="Том 24" loading="lazy">
                <img src="rezero-arc-6/25.webp" alt="Том 25" loading="lazy">
            </div>
        </div>

        <article id="content-container" class="recap-content">
            </article>
    </main>

    <script src="../js/rezero-arc-6.js"></script>
</body>
</html>
