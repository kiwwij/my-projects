<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровая доска | 2026</title>
    <meta name="author" content="kiwwij">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/wishlist-summer-2026.css">
</head>
<body>
    <div class="aurora-bg"></div>

    <header class="board-header">
        <div class="header-content">
            <div class="profile-area">
                <a href="https://steamcommunity.com/id/serhiosergey" target="_blank" style="text-decoration: none; border: none;">
                    <div class="avatar" id="avatar-container">
                        <i class='bx bxs-user-circle'></i>
                    </div>
                </a>
                <div class="title-area">
                    <h1>Игры, которые я хочу пройти. Лето-зима 2026</h1>
                    <div id="quick-stats" class="quick-stats">
                        </div>
                </div>
            </div>
            <div class="header-actions">
                <a href="#" id="refresh-ratings-btn" class="icon-link" title="Обновить данные"><i class='bx bx-refresh'></i></a>
                
                <a href="#" id="open-stats-btn" class="icon-link" title="Небольшая статистика"><i class='bx bx-bar-chart-alt-2'></i></a>
                <a href="https://store.steampowered.com/wishlist/id/serhiosergey/" target="_blank" class="icon-link" title="Мой wishlist в Steam"><i class='bx bxl-steam'></i></a>
                <a href="https://kiwwij.github.io/my-projects/html/kiwwij's-social-media-links.html" target="_blank" class="icon-link" title="Мои соцсети"><i class='bx bx-link-alt'></i></a>
            </div>
        </div>
    </header>

    <main class="kanban-board" id="kanban-board">
        </main>

    <div id="stats-modal-overlay" class="stats-modal-overlay">
        <div class="stats-modal">
            <div class="stats-modal-header">
                <h2><i class='bx bx-pie-chart-alt-2'></i> Статистика игр</h2>
                <button id="close-stats-btn" class="close-stats-btn"><i class='bx bx-x'></i></button>
            </div>
            <div class="stats-modal-body" id="stats-modal-body">
                </div>
        </div>
    </div>

    <script src="../js/wishlist/wishlist-summer-2026-data.js"></script>
    <script src="../js/wishlist-summer-2026.js"></script>
</body>
</html>
