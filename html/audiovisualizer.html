<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="kiwwij">
    <meta name="description" content="Браузерный аудиовизуализатор с функцией фоновой записи и перемотки трека.">
    
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/814/814513.png" type="image/png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <title>Aura | Advanced Visualizer</title>

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-main: #f0f0f0;
            --text-muted: #8b8b99;
            --accent: #8a63f7;
            --accent-hover: #7550db;
            --transition: 0.3s ease;
            --record-color: #ff4757;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1c;
            --text-muted: #6b6b7a;
            --accent: #6b4cd4;
            --accent-hover: #553bb5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 600; }

        .icon-btn {
            background: none; border: none; color: var(--text-main);
            font-size: 1.5rem; cursor: pointer; transition: color var(--transition);
            display: flex;
        }
        .icon-btn:hover { color: var(--accent); }

        .container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 40px 5%; width: 100%;
        }

        .hidden { display: none !important; }

        .upload-section {
            width: 100%; max-width: 600px; background: var(--card-bg);
            border: 2px dashed var(--text-muted); border-radius: 20px;
            padding: 60px 20px; text-align: center; cursor: pointer;
            transition: all var(--transition); margin: auto;
        }

        .upload-section:hover { border-color: var(--accent); transform: translateY(-2px); }
        .upload-content i { font-size: 4rem; color: var(--accent); }
        .hidden-input { display: none; }

        .player-section { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }

        .canvas-container {
            position: relative; width: 100%; height: 350px; background: var(--card-bg);
            border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transform: translateZ(0); 
        }

        .canvas-container.greenscreen-active { background: #00FF00; border-radius: 0; }
        canvas { width: 100%; height: 100%; display: block; }

        .recording-indicator {
            position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 10px;
            color: #fff; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;
            font-size: 0.9rem; z-index: 10;
        }
        .recording-indicator i { color: var(--record-color); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; font-weight: bold; color: white;
            background: rgba(0,0,0,0.6); z-index: 20;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .countdown-overlay.active { opacity: 1; }

        .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .timeline-container {
            display: flex; align-items: center; gap: 15px; width: 100%; margin-bottom: 20px;
        }
        .time-display { font-size: 0.9rem; color: var(--text-muted); min-width: 45px; text-align: center; }
        .timeline-container input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
        .timeline-container input[type=range]:disabled { opacity: 0.5; cursor: not-allowed; }

        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .track-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .control-btn {
            background: var(--accent); color: #fff; border: none; width: 50px; height: 50px;
            border-radius: 50%; font-size: 2rem; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: background var(--transition), transform 0.1s;
        }
        .control-btn:active { transform: scale(0.95); }

        .volume-control { display: flex; align-items: center; gap: 10px; }
        input[type=range] { accent-color: var(--accent); cursor: pointer; }

        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 10px; }
        .setting-item { display: flex; flex-direction: column; gap: 8px; }
        .setting-item label { font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }

        select, input[type=color] {
            padding: 8px; border-radius: 8px; border: 1px solid var(--text-muted);
            background: var(--bg-color); color: var(--text-main); font-family: inherit; outline: none; cursor: pointer;
        }
        input[type=color] { padding: 2px; height: 35px; width: 100%; }
        input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }

        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .record-btn {
            background: var(--record-color); color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-size: 1rem; font-family: inherit; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity var(--transition);
        }
        .record-btn:hover { opacity: 0.9; }
        .record-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .record-btn.recording { background: #2d3436; }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .track-info, .volume-control { width: 100%; justify-content: center; }
            .canvas-container { height: 250px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" title="Aura - Браузерный визуализатор звука">
            <i class='bx bx-podcast'></i> <span>Браузерный визуализатор звука</span>
        </div>
        <button id="themeToggle" class="icon-btn" title="Переключить тему оформления">
            <i class='bx bx-moon'></i>
        </button>
    </header>

    <main class="container">
        <section class="upload-section" id="uploadSection" title="Нажмите или перетащите аудиофайл">
            <div class="upload-content">
                <i class='bx bx-cloud-upload'></i>
                <h1>Загрузите трек</h1>
                <p>Перетащите файл сюда или нажмите для выбора</p>
                <input type="file" id="audioInput" accept="audio/*" class="hidden-input">
            </div>
        </section>

        <section class="player-section hidden" id="playerSection">
            <div class="canvas-container" id="canvasContainer">
                <div class="countdown-overlay" id="countdownOverlay">3</div>
                <div class="recording-indicator hidden" id="recordingIndicator">
                    <i class='bx bxs-circle'></i> Идёт фоновая запись (REC)
                </div>
                <canvas id="visualizer"></canvas>
            </div>
            
            <div class="dashboard">
                <div class="panel">
                    <div class="timeline-container">
                        <span id="currentTime" class="time-display">00:00</span>
                        <input type="range" id="seekSlider" min="0" value="0" step="0.1" title="Перемотка трека">
                        <span id="durationTime" class="time-display">00:00</span>
                    </div>

                    <div class="controls">
                        <div class="track-info">
                            <i class='bx bx-music'></i> <span id="trackName">Трек</span>
                        </div>
                        <button id="playBtn" class="control-btn" title="Воспроизвести / Пауза"><i class='bx bx-play'></i></button>
                        <div class="volume-control">
                            <i class='bx bx-volume-full'></i>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" title="Громкость">
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3 style="margin-bottom: 15px; font-size: 1.1rem;"><i class='bx bx-slider-alt'></i> Настройки генерации</h3>
                    <div class="settings-grid">
                        <div class="setting-item">
                            <label>Форма визуализатора</label>
                            <select id="shapeSelect">
                                <option value="bars">Бары (от центра)</option>
                                <option value="circle">Круговой спектр</option>
                                <option value="wave">Осциллограф (Волна)</option>
                            </select>
                        </div>

                        <div class="setting-item">
                            <label>Цвет 1 (Градиент)</label>
                            <input type="color" id="color1" value="#8a63f7">
                        </div>

                        <div class="setting-item">
                            <label>Цвет 2 (Градиент)</label>
                            <input type="color" id="color2" value="#ff758c">
                        </div>

                        <div class="setting-item" style="justify-content: center;">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="autoColorCheck"> Авто-цвет (Радуга)
                            </label>
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="greenScreenCheck"> Зелёный фон (Хромакей)
                            </label>
                        </div>

                        <div class="setting-item" style="justify-content: center;">
                            <button id="recordBtn" class="record-btn">
                                <i class='bx bx-video-recording'></i> Записать футаж
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <audio id="audioElement" crossorigin="anonymous"></audio>
        </section>
    </main>

    <script>
        let currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon();

        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            updateThemeIcon();
            if(!isPlaying && greenScreenCheck.checked) drawFrame(); 
        });

        function updateThemeIcon() {
            const icon = document.querySelector('#themeToggle i');
            icon.className = currentTheme === 'dark' ? 'bx bx-sun' : 'bx bx-moon';
        }

        const uploadSection = document.getElementById('uploadSection');
        const audioInput = document.getElementById('audioInput');
        const playerSection = document.getElementById('playerSection');
        const audioElement = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const trackName = document.getElementById('trackName');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const canvasContainer = document.getElementById('canvasContainer');

        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const countdownOverlay = document.getElementById('countdownOverlay');

        const shapeSelect = document.getElementById('shapeSelect');
        const color1Input = document.getElementById('color1');
        const color2Input = document.getElementById('color2');
        const autoColorCheck = document.getElementById('autoColorCheck');
        const greenScreenCheck = document.getElementById('greenScreenCheck');
        const recordBtn = document.getElementById('recordBtn');
        const recordingIndicator = document.getElementById('recordingIndicator');

        let audioContext, analyser, waveAnalyser, source, mediaStreamDestination;
        let dataArray, timeDomainDataArray;
        let isPlaying = false, isRecording = false;
        let animationId;
        let autoHue = 0;
        let mediaRecorder, recordedChunks = [];

        const workerBlob = new Blob([`
            let timer = null;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    timer = setInterval(() => self.postMessage('tick'), 1000 / 60);
                } else if (e.data === 'stop') {
                    clearInterval(timer);
                }
            };
        `], { type: 'application/javascript' });
        const bgWorker = new Worker(URL.createObjectURL(workerBlob));

        bgWorker.onmessage = function() {
            if (isRecording && isPlaying) drawFrame(); 
        };

        greenScreenCheck.addEventListener('change', (e) => {
            const isGS = e.target.checked;
            color1Input.disabled = isGS;
            color2Input.disabled = isGS;
            autoColorCheck.disabled = isGS;
            if(!isPlaying) drawFrame(); 
        });

        uploadSection.addEventListener('click', () => audioInput.click());
        audioInput.addEventListener('change', (e) => { if (e.target.files[0]) initAudio(e.target.files[0]); });

        function initAudio(file) {
            if (audioContext) {
                audioContext.close();
                cancelAnimationFrame(animationId);
            }

            const fileURL = URL.createObjectURL(file);
            audioElement.src = fileURL;
            trackName.textContent = file.name;

            uploadSection.classList.add('hidden');
            playerSection.classList.remove('hidden');

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.smoothingTimeConstant = 0.85;
            analyser.fftSize = 256; 

            source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            mediaStreamDestination = audioContext.createMediaStreamDestination();
            analyser.connect(mediaStreamDestination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            waveAnalyser = audioContext.createAnalyser();
            waveAnalyser.fftSize = 1024; 
            source.connect(waveAnalyser);
            timeDomainDataArray = new Uint8Array(waveAnalyser.frequencyBinCount);

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            audioElement.onloadedmetadata = () => {
                seekSlider.max = audioElement.duration;
                durationTimeEl.textContent = formatTime(audioElement.duration);
            };

            togglePlay();
        }

        function formatTime(sec) {
            let min = Math.floor(sec / 60) || 0;
            let s = Math.floor(sec % 60) || 0;
            return `${min}:${s < 10 ? '0' : ''}${s}`;
        }

        audioElement.addEventListener('timeupdate', () => {
            if (!isRecording) {
                seekSlider.value = audioElement.currentTime;
            }
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
        });

        seekSlider.addEventListener('input', () => {
            if (!isRecording) {
                audioElement.currentTime = seekSlider.value;
                currentTimeEl.textContent = formatTime(seekSlider.value);
            }
        });

        function resizeCanvas() {
            canvas.width = canvasContainer.clientWidth;
            canvas.height = canvasContainer.clientHeight;
            if(!isPlaying) drawFrame(); 
        }

        function drawFrame() {
            const width = canvas.width;
            const height = canvas.height;
            const isGreenScreen = greenScreenCheck.checked;

            if (isGreenScreen) {
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(0, 0, width, height);
                canvasContainer.classList.add('greenscreen-active');
            } else {
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim();
                ctx.fillRect(0, 0, width, height);
                canvasContainer.classList.remove('greenscreen-active');
            }

            let currentColor1, currentColor2;

            if (isGreenScreen) {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                const solidColor = isLight ? '#000000' : '#ffffff';
                currentColor1 = solidColor;
                currentColor2 = solidColor;
            } else {
                if (autoColorCheck.checked) {
                    autoHue = (autoHue + 0.5) % 360;
                    currentColor1 = `hsl(${Math.floor(autoHue)}, 100%, 60%)`;
                    currentColor2 = `hsl(${Math.floor((autoHue + 60) % 360)}, 100%, 60%)`;
                } else {
                    currentColor1 = color1Input.value;
                    currentColor2 = color2Input.value;
                }
            }

            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, currentColor1);
            gradient.addColorStop(1, currentColor2);
            ctx.fillStyle = gradient;
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 3;

            const shape = shapeSelect.value;

            if (shape === 'bars') {
                analyser.getByteFrequencyData(dataArray);
                const barWidth = (width / dataArray.length) * 2.5;
                let x = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const barHeight = (dataArray[i] / 255) * height * 0.8;
                    const y = Math.floor((height - barHeight) / 2);
                    
                    ctx.beginPath();
                    ctx.rect(Math.floor(x), y, Math.floor(barWidth - 2), Math.floor(barHeight));
                    ctx.fill();
                    x += barWidth + 2;
                }
            } 
            else if (shape === 'circle') {
                analyser.getByteFrequencyData(dataArray);
                const centerX = width / 2;
                const centerY = height / 2;
                const radius = Math.floor(Math.min(centerX, centerY) * 0.4);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();

                for (let i = 0; i < dataArray.length; i++) {
                    const barHeight = (dataArray[i] / 255) * (Math.min(centerX, centerY) - radius);
                    const angle = (i / dataArray.length) * Math.PI * 2;
                    
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    ctx.beginPath();
                    ctx.rect(-2, radius, 4, Math.floor(barHeight));
                    ctx.fill();
                    ctx.restore();
                }
            }
            else if (shape === 'wave') {
                waveAnalyser.getByteTimeDomainData(timeDomainDataArray);
                ctx.beginPath();
                const sliceWidth = width / timeDomainDataArray.length;
                let x = 0;

                for (let i = 0; i < timeDomainDataArray.length; i++) {
                    const v = timeDomainDataArray[i] / 128.0;
                    const y = Math.floor(v * height / 2);

                    if (i === 0) ctx.moveTo(Math.floor(x), y);
                    else ctx.lineTo(Math.floor(x), y);

                    x += sliceWidth;
                }
                ctx.lineTo(width, Math.floor(height / 2));
                ctx.stroke();
            }
        }

        function drawLoop() {
            if (!isPlaying || isRecording) return; 
            drawFrame();
            animationId = requestAnimationFrame(drawLoop);
        }

        playBtn.addEventListener('click', togglePlay);

        function togglePlay() {
            if (audioContext.state === 'suspended') audioContext.resume();
            
            if (isPlaying) {
                audioElement.pause();
                playBtn.innerHTML = "<i class='bx bx-play'></i>";
                isPlaying = false;
            } else {
                audioElement.play();
                playBtn.innerHTML = "<i class='bx bx-pause'></i>";
                isPlaying = true;
                if (!isRecording) drawLoop(); 
            }
        }

        volumeSlider.addEventListener('input', (e) => { audioElement.volume = e.target.value; });

        audioElement.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.innerHTML = "<i class='bx bx-play'></i>";
            if(isRecording) stopRecording(); 
        });

        recordBtn.addEventListener('click', () => {
            if (!isRecording) prepareRecording();
            else stopRecording();
        });

        function prepareRecording() {
            if (!audioContext || audioContext.state === 'suspended') {
                alert("Сначала загрузите трек."); return;
            }
            
            if (isPlaying) togglePlay(); 

            let count = 3;
            countdownOverlay.textContent = count;
            countdownOverlay.classList.add('active');
            recordBtn.disabled = true;
            seekSlider.disabled = true;

            let countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.textContent = count;
                } else {
                    clearInterval(countdownInterval);
                    countdownOverlay.classList.remove('active');
                    recordBtn.disabled = false;
                    startRecording();
                }
            }, 1000);
        }

        function startRecording() {
            recordedChunks = [];
            const canvasStream = canvas.captureStream(60);
            const audioStream = mediaStreamDestination.stream;
            
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...audioStream.getAudioTracks()
            ]);

            try { mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' }); } 
            catch (e) { mediaRecorder = new MediaRecorder(combinedStream); }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            
            mediaRecorder.onstop = saveRecording;
            mediaRecorder.start(250); 
            isRecording = true;
            
            recordingIndicator.classList.remove('hidden');
            recordBtn.classList.add('recording');
            recordBtn.innerHTML = "<i class='bx bx-stop-circle'></i> Остановить и скачать";
            
            cancelAnimationFrame(animationId);
            bgWorker.postMessage('start');

            if (!isPlaying) togglePlay(); 
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            
            recordingIndicator.classList.add('hidden');
            recordBtn.classList.remove('recording');
            recordBtn.innerHTML = "<i class='bx bx-video-recording'></i> Записать футаж";
            seekSlider.disabled = false;
            
            bgWorker.postMessage('stop');
            if (isPlaying) drawLoop();
        }

        function saveRecording() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `Aura_Footage_${trackName.textContent.replace(/[^a-z0-9]/gi, '_')}.webm`;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
