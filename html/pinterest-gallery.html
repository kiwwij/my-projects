<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="kiwwij">
    <meta name="description" content="Эстетичная галерея Pinterest-досок.">
    
    <title>Pinterest Галерея | kiwwij</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pinterest-gallery.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" title="Переключить тему">
        <i class='bx bx-moon'></i>
    </button>

    <main class="container">
        <header>
            <a href="https://ru.pinterest.com/k1wwij/" target="_blank" class="profile-link" title="Перейти в Pinterest">
                <img src="https://i.pinimg.com/736x/73/86/40/73864001ccc5080e56b86a6eee554883.jpg" alt="Аватар kiwwij" class="profile-avatar">
                <h1>kiwwij</h1>
                <p class="profile-username">@k1wwij</p>
            </a>
            <p class="profile-desc">Нажмите на карточку доски для просмотра пинов</p>
        </header>

        <div class="board-grid">
            <!-- ОТКРЫТЫЕ ДОСКИ -->
            <div class="card" data-url="https://ru.pinterest.com/k1wwij/%D0%B0%D0%B2%D0%B0%D1%82%D0%B0%D1%80%D0%BA%D0%B8-2026/" data-type="embedBoard">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-image-alt'></i>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>аватарки 2026</h3>
                    <p>85 пинов</p>
                </div>
            </div>
            
            <div class="card" data-url="https://ru.pinterest.com/k1wwij/3d-%D1%82%D1%8F%D0%BD%D0%BE%D1%87%D0%BA%D0%B8/" data-type="embedBoard">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-cube-alt'></i>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>3D тяночки</h3>
                    <p>28 пинов</p>
                </div>
            </div>

            <!-- ЗАКРЫТЫЕ ДОСКИ -->
            <div class="card custom-board" data-id="goodPictures" data-type="customGallery">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-images'></i>
                    <div class="badge"><i class='bx bxs-lock-alt'></i></div>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>good pictures</h3>
                    <p><i class='bx bxs-lock-alt'></i> <span class="pin-count">0</span> пинов</p>
                </div>
            </div>

            <div class="card custom-board" data-id="tattoo" data-type="customGallery">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-pen'></i>
                    <div class="badge"><i class='bx bxs-lock-alt'></i></div>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>tattoo</h3>
                    <p><i class='bx bxs-lock-alt'></i> <span class="pin-count">0</span> пинов</p>
                </div>
            </div>

            <div class="card custom-board" data-id="animeGifs" data-type="customGallery">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-movie-play'></i>
                    <div class="badge"><i class='bx bxs-lock-alt'></i></div>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>Anime gifs for discord...</h3>
                    <p><i class='bx bxs-lock-alt'></i> <span class="pin-count">0</span> пинов</p>
                </div>
            </div>

            <!-- АРХИВИРОВАННЫЕ ДОСКИ -->
            <div class="card custom-board" data-id="avatars2025" data-type="customGallery">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-user-circle'></i>
                    <div class="badge"><i class='bx bxs-archive-in'></i></div>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>аватарки 2025</h3>
                    <p><i class='bx bxs-archive-in'></i> <span class="pin-count">0</span> пинов</p>
                </div>
            </div>

            <div class="card custom-board" data-id="avatars202526" data-type="customGallery">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-user-circle'></i>
                    <div class="badge"><i class='bx bxs-archive-in'></i></div>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>аватарки 2025/26</h3>
                    <p><i class='bx bxs-archive-in'></i> <span class="pin-count">0</span> пинов</p>
                </div>
            </div>

            <div class="card custom-board" data-id="avatars202425" data-type="customGallery">
                <div class="card-image-wrapper icon-placeholder">
                    <i class='bx bx-user-circle'></i>
                    <div class="badge"><i class='bx bxs-archive-in'></i></div>
                    <div class="overlay"></div>
                </div>
                <div class="card-info">
                    <h3>аватарки 2024/25</h3>
                    <p><i class='bx bxs-archive-in'></i> <span class="pin-count">0</span> пинов</p>
                </div>
            </div>
        </div>
    </main>

    <div id="modal" class="modal" title="Нажмите вне окна, чтобы закрыть">
        <div class="modal-content">
            <button class="close-btn" title="Закрыть (или нажмите Esc)"><i class='bx bx-x'></i></button>
            <div id="widget-container" class="widget-container"></div>
        </div>
    </div>

    <script async defer src="//assets.pinterest.com/js/pinit.js"></script>
    <script src="../js/pinterest-gallery.js"></script>
</body>
</html>
