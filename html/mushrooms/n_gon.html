<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гриби Вінниччини - Алгоритм (n-кутник)</title>
    <link rel="icon" type="image/webp" href="logo.webp">
    <link rel="stylesheet" href="../../css/mushrooms.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .algorithm-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            justify-content: center;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 500;
        }

        .control-group input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .control-group input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: transparent;
        }

        button {
            padding: 10px 20px;
            background-color: var(--header-bg);
            color: var(--header-text);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: scale(0.98);
        }

        canvas {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 100%;
            max-width: 700px;
            height: 500px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] canvas {
            background-color: #e0e0e0; 
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.webp" alt="Логотип">
            <h1>Гриби Вінниччини</h1>
        </div>
        <nav>
            <a href="../mushrooms.html"><i class='bx bx-home'></i> Головна</a>
            <a href="popular.html"><i class='bx bx-basket'></i> Популярні</a>
            <a href="other.html"><i class='bx bx-leaf'></i> Пластинчасті</a>
            <a href="poisonous.html"><i class='bx bx-error-circle'></i> Небезпечні</a>
            <a href="lissajous_figure.html"><i class='bx bx-math'></i> Фігура Ліссажу</a>
            <a href="algorithm.html" style="color: #c8e6c9;"><i class='bx bx-shape-polygon'></i> Алгоритм</a>
        </nav>
    </header>

    <main>
        <div class="hero-section" style="margin-bottom: 20px;">
            <h2>Побудова заданого n-кутника</h2>
            <p>Реалізація алгоритму для побудови правильних багатокутників. Виберіть параметри та натисніть кнопку для малювання.</p>
        </div>
        
        <div class="algorithm-container">
            <div class="controls">
                <div class="control-group">
                    <label for="entry_n">Кількість кутів (n):</label>
                    <input type="number" id="entry_n" value="5" min="3">
                </div>
                
                <div class="control-group">
                    <label for="entry_r">Радіус (R):</label>
                    <input type="number" id="entry_r" value="150" min="10">
                </div>
                
                <div class="control-group">
                    <label for="btn_color">Колір:</label>
                    <input type="color" id="btn_color" value="#000000">
                </div>
                
                <button id="drawBtn">Малювати</button>
            </div>
            
            <canvas id="drawingCanvas" width="700" height="500"></canvas>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Проєкт «Гриби Вінниччини»</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            const drawBtn = document.getElementById("drawBtn");

            function drawNgon() {
                const n = parseInt(document.getElementById('entry_n').value);
                const r = parseFloat(document.getElementById('entry_r').value);
                const color = document.getElementById('btn_color').value;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (isNaN(n) || isNaN(r) || n < 3) {
                    return; 
                }

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const startAngle = -Math.PI / 2; 

                ctx.beginPath();
                
                for (let i = 0; i < n; i++) {
                    const angle = startAngle + (2 * Math.PI * i) / n;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.closePath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            drawNgon();
            drawBtn.addEventListener("click", drawNgon);
        });
    </script>
</body>
</html>
