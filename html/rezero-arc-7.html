<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="kiwwij">
    <meta name="description" content="Полный пересказ 6-ой арки Re:Zero. История Башни Плеяд, испытаний и потерянных воспоминаний.">
    <title>Re:Zero - Пересказ 7-ой арки</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <link rel="stylesheet" href="../css/rezero-arc-6.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-content">
            <div class="logo">
                <i class='bx bx-book-reader'></i>
                <span>Пересказ 7-ой арки Re:Zero</span>
            </div>
            <div class="controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Переключить тему">
                    <i class='bx bx-moon'></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="hero">
            <img src="rezero-arc-7/rezero-arc-7.jpg" alt="Обложка 7-ой арки" loading="lazy" class="hero-image">
            
            <h1 id="main-title">Пересказ 7-ой арки Re:Zero</h1>
            <p class="short-desc">7-я арка переносит Субару в Империю Волакия, где ему предстоит пережить новые испытания, гладиаторские бои и стать участником полномасштабного государственного переворота.</p>
        </div>

        <div class="volumes-section">
            <div class="volumes-badge">
                <i class='bx bx-book-bookmark'></i>
                <span>Тома ранобэ:</span>
            </div>
            
            <div class="posters-grid">
                <img src="rezero-arc-7/26.webp" alt="Том 26" loading="lazy">
                <img src="rezero-arc-7/27.webp" alt="Том 27" loading="lazy">
                <img src="rezero-arc-7/28.webp" alt="Том 28" loading="lazy">
                <img src="rezero-arc-7/29.webp" alt="Том 29" loading="lazy">
                <img src="rezero-arc-7/30.webp" alt="Том 30" loading="lazy">
                <img src="rezero-arc-7/31.webp" alt="Том 31" loading="lazy">
                <img src="rezero-arc-7/32.webp" alt="Том 32" loading="lazy">
                <img src="rezero-arc-7/33.webp" alt="Том 33" loading="lazy">
            </div>
        </div>

        <article id="content-container" class="recap-content">
            </article>
    </main>

    <script src="../js/rezero-arc-7.js"></script>
</body>
</html>
