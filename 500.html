<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>500 | Internal Server Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <style>
        :root {
            --bg-color: #f7f3ee;
            --text-main: #332b26;
            --text-subtle: rgba(51, 43, 38, 0.08);
            --panel-bg: rgba(247, 243, 238, 0.6);
            --accent: #E04F33;
            --pod-body: linear-gradient(135deg, #e0dbcf, #b8b2a4);
            --server-body: linear-gradient(135deg, #605d58, #3b3935);
        }

        [data-theme="dark"] {
            --bg-color: #161514;
            --text-main: #e8dfd8;
            --text-subtle: rgba(255, 255, 255, 0.05);
            --panel-bg: rgba(22, 21, 20, 0.6);
            --accent: #FF6B4A;
            --pod-body: linear-gradient(135deg, #66635d, #42403a);
            --server-body: linear-gradient(135deg, #2c2a27, #181715);
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            user-select: none;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            min-height: 100vh;
            background: var(--bg-color);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        .top-panel {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--text-subtle);
        }

        .social-links { 
            display: flex; gap: 12px; flex-wrap: wrap; max-width: 80%;
        }
        .social-links a {
            color: var(--text-main); font-size: 1.4rem;
            text-decoration: none; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .social-links a:hover { color: var(--accent); transform: translateY(-3px); }

        .theme-toggle {
            cursor: pointer; font-size: 1.6rem;
            display: flex; align-items: center;
            color: var(--text-main);
        }

        .bg-500 {
            position: absolute;
            top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: clamp(8rem, 25vw, 22rem);
            font-weight: 800;
            color: var(--text-subtle);
            z-index: 0;
            line-height: 1;
            pointer-events: none;
            letter-spacing: -5px;
        }

        .container {
            position: relative; z-index: 10;
            width: 100%; max-width: 800px;
            text-align: center; padding: 0 20px;
        }

        .art-scene {
            position: relative; width: 100%; height: 260px;
            margin: 0 auto 30px;
        }

        .ground-line {
            position: absolute; bottom: 0; left: 15%;
            width: 70%; height: 2px;
            background: var(--text-subtle);
            border-radius: 2px;
        }

        .pod-bot {
            position: absolute; bottom: 45px; left: 25%;
            width: 70px; height: 95px; z-index: 15;
            animation: floatPanic 3s ease-in-out infinite;
        }

        .pod-body {
            position: relative; width: 100%; height: 100%;
            background: var(--pod-body);
            border-radius: 20px 20px 32px 32px;
            box-shadow: inset -4px -6px 0 rgba(0,0,0,0.15), inset 2px 2px 0 rgba(255,255,255,0.1);
            z-index: 2;
        }

        .pod-eye-lens {
            position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 36px; background: #111;
            border-radius: 50%; border: 2px solid #ddd; box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
        }
        
        .pod-eye-lens::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 14px; height: 14px; background: #ffaa22; border-radius: 50%;
            animation: panicEye 0.4s infinite alternate;
        }

        .pod-antenna {
            position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
            width: 3px; height: 24px; background: #8f8a7c;
        }
        .pod-antenna::before {
            content: ""; position: absolute; top: -7px; left: -5px;
            width: 12px; height: 12px; background: #b87c4f; border-radius: 50%;
            animation: antennaAlarm 0.5s infinite;
        }

        .pod-wing {
            position: absolute; top: 38px; width: 18px; height: 44px;
            background: #a39b8c; border-radius: 8px; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.2);
        }
        .pod-wing.left { left: -14px; transform: rotate(15deg); }
        .pod-wing.right { right: -14px; transform: rotate(-15deg); }
        
        .pod-thruster {
            position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 10px; background: #222; border-radius: 4px; z-index: 1;
        }
        .pod-fire {
            position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 38px;
            background: linear-gradient(to bottom, #fff, #ffcf40, transparent);
            border-radius: 50% 50% 20% 20%; filter: blur(2px); 
            animation: fireFlicker 0.1s infinite alternate; z-index: 0;
        }

        .broken-server {
            position: absolute; bottom: 2px; right: 25%;
            width: 90px; height: 150px; z-index: 10;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
        }

        .server-rack {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--server-body);
            border-radius: 8px 8px 2px 2px;
            border: 3px solid #2a2825;
            box-shadow: inset 5px 0 15px rgba(255,255,255,0.05), inset -5px 0 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 8px;
        }

        .server-slot {
            width: 80%; height: 14px; background: #1a1816;
            border-radius: 3px; position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .led {
            position: absolute; right: 6px; top: 4px;
            width: 6px; height: 6px; border-radius: 50%;
            background: #444;
        }
        .led.green { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
        .led.red-blink { background: #ff3b30; animation: blinkFast 0.3s infinite alternate; }
        .led.dead { background: #222; }

        .sparks {
            position: absolute; top: 40px; left: -10px;
            width: 2px; height: 15px; background: #FFD700;
            border-radius: 2px; box-shadow: 0 0 8px #FFD700;
            animation: sparkJump 2s infinite;
            z-index: 20;
        }
        .sparks.two {
            top: 70px; left: auto; right: -5px;
            animation: sparkJump 1.5s infinite 0.5s;
        }

        .smoke-plume {
            position: absolute; top: -10px; left: 30%;
            width: 30px; height: 30px; background: rgba(120, 120, 120, 0.4);
            border-radius: 50%; filter: blur(5px);
            animation: riseSmoke 2.5s infinite ease-in; opacity: 0;
        }
        .smoke-plume:nth-child(2) { animation-delay: 0.8s; left: 50%; }
        .smoke-plume:nth-child(3) { animation-delay: 1.6s; left: 10%; width: 40px; height: 40px; }

        @keyframes floatPanic { 
            0%, 100% { transform: translateY(0) rotate(0deg); } 
            25% { transform: translateY(-12px) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
            75% { transform: translateY(-15px) rotate(-1deg); }
        }
        @keyframes panicEye {
            0% { background: #ffaa22; box-shadow: 0 0 10px #ffaa22; }
            100% { background: #ff3311; box-shadow: 0 0 15px #ff3311; transform: translate(-50%, -50%) scale(1.2); }
        }
        @keyframes antennaAlarm {
            0%, 100% { background: #b87c4f; box-shadow: none; }
            50% { background: #ff3311; box-shadow: 0 0 8px #ff3311; }
        }
        @keyframes fireFlicker { 
            0% { opacity: 0.8; transform: translateX(-50%) scaleY(1); } 
            100% { opacity: 1; transform: translateX(-50%) scaleY(1.3); } 
        }
        @keyframes blinkFast {
            0% { opacity: 0.2; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 10px #ff3b30; }
        }
        @keyframes sparkJump {
            0% { transform: scale(0) translate(0, 0) rotate(0deg); opacity: 0; }
            10% { transform: scale(1) translate(-15px, -15px) rotate(-45deg); opacity: 1; }
            20% { transform: scale(0) translate(-25px, 0px) rotate(-90deg); opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes riseSmoke {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-70px) scale(2.5); opacity: 0; }
        }

        .text-content h1 { font-size: 2.2rem; margin-bottom: 12px; font-weight: 800; color: var(--accent); }
        .text-content p { font-size: 1.1rem; opacity: 0.8; max-width: 500px; margin: 0 auto; line-height: 1.6; }

        @media (max-width: 600px) {
            .top-panel { padding: 10px 15px; }
            .bg-500 { font-size: 6rem; }
            .pod-bot { left: 10%; }
            .broken-server { right: 10%; width: 70px; height: 120px; }
        }
    </style>
</head>
<body>

    <header class="top-panel">
        <div class="social-links" id="socialBox">
            <a href="https://www.youtube.com/@serhiosergey" title="YouTube" target="_blank" rel="noopener noreferrer"><i class='bx bxl-youtube'></i></a>

                <svg style="width: 1em; height: 1em;" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>

        </div>
        <div class="theme-toggle" id="themeBtn">
            <i class='bx bx-moon'></i>
        </div>
    </header>

    <div class="bg-500">500</div>

    <div class="container">
        <div class="art-scene">
            <div class="ground-line"></div>
            
            <div class="pod-bot">
                <div class="pod-body">
                    <div class="pod-eye-lens"></div>
                    <div class="pod-antenna"></div>
                    <div class="pod-wing left"></div>
                    <div class="pod-wing right"></div>
                </div>
                <div class="pod-thruster"><div class="pod-fire"></div></div>
            </div>

            <div class="broken-server">
                <div class="smoke-plume"></div>
                <div class="smoke-plume"></div>
                <div class="smoke-plume"></div>
                <div class="sparks"></div>
                <div class="sparks two"></div>
                
                <div class="server-rack">
                    <div class="server-slot"><div class="led green"></div></div>
                    <div class="server-slot"><div class="led red-blink"></div></div>
                    <div class="server-slot"><div class="led dead"></div></div>
                    <div class="server-slot"><div class="led dead"></div></div>
                    <div class="server-slot"><div class="led red-blink"></div></div>
                </div>
            </div>
        </div>
        
        <div class="text-content">
            <h1>Server Meltdown</h1>
            <p>Oops! Something went terribly wrong on our end. The server gears are currently jammed, but our mechanics are already working on a fix.</p>
        </div>
    </div>

<script>
    const themeBtn = document.getElementById('themeBtn');
    const icon = themeBtn.querySelector('i');
    
    function setTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        icon.className = theme === 'dark' ? 'bx bx-sun' : 'bx bx-moon';
    }

    const savedTheme = localStorage.getItem('theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
        setTheme(savedTheme);
    } else if (systemDark) {
        setTheme('dark');
    }

    themeBtn.addEventListener('click', () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        setTheme(isDark ? 'light' : 'dark');
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem('theme')) {
            setTheme(e.matches ? 'dark' : 'light');
        }
    });
</script>
